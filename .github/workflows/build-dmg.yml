name: Build macOS DMG

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Checkout local dependencies
      run: |
        git clone https://github.com/lorentey/BTree.git ../BTree
        git clone https://github.com/sindresorhus/Settings.git ../Settings

    - name: Set up ffmpeg-kit
      run: |
        curl -L -o ffmpeg-kit.zip https://github.com/netdcy/ffmpeg-kit/releases/download/v6.0/ffmpeg-kit-full-gpl-6.0-macos-xcframework.zip
        unzip -q ffmpeg-kit.zip
        mkdir -p ../ffmpeg-kit-build/bundle-apple-xcframework-macos
        cp -R ffmpeg-kit-full-gpl-6.0-macos-xcframework/* ../ffmpeg-kit-build/bundle-apple-xcframework-macos/

    - name: Build and Archive
      run: |
        xcodebuild -project FlowVision.xcodeproj \
                   -scheme FlowVision \
                   -configuration Release \
                   -archivePath $PWD/build/FlowVision.xcarchive \
                   clean archive \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO

    - name: Export App
      run: |
        mkdir -p $PWD/build/Export
        cp -R "$PWD/build/FlowVision.xcarchive/Products/Applications/FlowVision.app" "$PWD/build/Export/"

    - name: Install create-dmg
      run: brew install create-dmg

    - name: Create DMG
      run: |
        cd build/Export
        create-dmg \
          --volname "FlowVision" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "FlowVision.app" 150 190 \
          --hide-extension "FlowVision.app" \
          --app-drop-link 450 190 \
          "FlowVision.dmg" \
          "FlowVision.app"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FlowVision-DMG
        path: build/Export/FlowVision.dmg
